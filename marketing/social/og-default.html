<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonbloom Labs default OG image</title>
    <link rel="stylesheet" href="../brand/board.css" />
    <link rel="stylesheet" href="og-default.css" />
  </head>
  <body>
    <p class="board-note">
      Default Open Graph / link-preview image, 1200 x 630. Renders to og-default.png.
    </p>
    <section class="artboard night-950 og" data-out="og-default.png" data-truecolor="1">
      <svg class="stars" viewBox="0 0 1200 630" width="1200" height="630" aria-hidden="true">
        <circle cx="880" cy="80" r="2.2" fill="#B9C0E4" opacity="0.8" />
        <circle cx="930" cy="250" r="1.8" fill="#B9C0E4" opacity="0.6" />
        <circle cx="1120" cy="250" r="2" fill="#B9C0E4" opacity="0.7" />
        <circle cx="790" cy="190" r="1.6" fill="#B9C0E4" opacity="0.5" />
      </svg>
      <div class="band" aria-hidden="true"></div>
      <img class="wave" src="../brand/art/horizon-wave-dawn-50.svg" alt="" />
      <img class="flower" src="../brand/art/flower-open.svg" alt="" />
      <img class="moon" src="../brand/art/moon.svg" alt="" />
      <img
        class="logo"
        src="../brand/logo/moonbloom-horizontal-on-night.svg"
        alt="Moonbloom Labs"
      />
      <div class="copy">
        <p class="display tagline">Ideas bloom overnight.</p>
        <p class="sub muted">Plant an idea at night. Wake up to done.</p>
      </div>
    </section>
  </body>
</html>
