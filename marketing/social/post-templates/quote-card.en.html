<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonbloom Labs quote card</title>
    <link rel="stylesheet" href="../../brand/board.css" />
    <link rel="stylesheet" href="posts.css" />
  </head>
  <body>
    <p class="board-note">
      Quote card template, 1080 x 1080. Replace the quote and caption with approved copy only; keep
      it to one short sentence. Current text: About page h1 and principle (docs/plan/copy.md section
      5).
    </p>
    <section class="artboard post night-950 sq quote" data-out="quote-card.png">
      <svg class="stars" viewBox="0 0 1080 1080" width="1080" height="1080" aria-hidden="true">
        <circle cx="820" cy="90" r="2.4" fill="#B9C0E4" opacity="0.8" />
        <circle cx="980" cy="290" r="2" fill="#B9C0E4" opacity="0.6" />
        <circle cx="720" cy="200" r="1.6" fill="#B9C0E4" opacity="0.5" />
        <circle cx="140" cy="120" r="1.8" fill="#B9C0E4" opacity="0.6" />
      </svg>
      <img class="moon" src="../../brand/art/moon.svg" alt="" />
      <img class="hills" src="../../brand/art/hills-ridge.svg" alt="" />
      <img class="bud" src="../../brand/art/bud.svg" alt="" />
      <figure>
        <p class="mark" aria-hidden="true">“</p>
        <blockquote class="display">A human decides. Agents build.</blockquote>
        <figcaption class="body muted">
          You approve the scope in the evening and the result in the morning, and nothing ships
          without human approval.
        </figcaption>
      </figure>
      <div class="foot">
        <img src="../../brand/logo/moonbloom-horizontal-on-night.svg" alt="Moonbloom Labs" />
        <p>moonbloomlabs.com</p>
      </div>
    </section>
  </body>
</html>
