<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonbloom Labs email signature</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #ffffff">
    <!--
      Moonbloom Labs email signature.
      How to use: open this file in a browser, select the signature table below (from the mark to the
      tagline), copy, and paste it into the signature settings of Gmail, Outlook or Apple Mail.
      Inline styles and a table layout only, so it survives email clients. Brand fonts are not available
      in most clients; Georgia and Segoe UI / Arial are the fallbacks from the brand guidelines.
      Colours (on white): night-950 #0F1433 17.98:1, dusk-600 #4B4A6E 8.39:1, bloom-700 #8C2E55 7.96:1.
      Replace [TODO: title] before use.

      Plain-text variant (for clients that strip HTML):

      Michal Maxian
      [TODO: title], Moonbloom Labs
      michal@maxian.sk
      moonbloomlabs.com
      Ideas bloom overnight.
    -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt"
    >
      <tr>
        <td valign="top" style="padding: 2px 16px 0 0">
          <a href="https://moonbloomlabs.com" style="text-decoration: none"
            ><img
              src="https://moonbloomlabs.com/icon-192.png"
              width="48"
              height="48"
              alt="Moonbloom Labs"
              style="display: block; width: 48px; height: 48px; border: 0; border-radius: 10px"
          /></a>
        </td>
        <td valign="top" style="padding: 0 0 0 16px; border-left: 1px solid #7d7290">
          <p
            style="
              margin: 0;
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 18px;
              line-height: 24px;
              color: #0f1433;
            "
          >
            Michal Maxian
          </p>
          <p
            style="
              margin: 0 0 8px;
              font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
              font-size: 14px;
              line-height: 20px;
              color: #4b4a6e;
            "
          >
            [TODO: title], Moonbloom Labs
          </p>
          <p
            style="
              margin: 0;
              font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
              font-size: 14px;
              line-height: 20px;
            "
          >
            <a href="mailto:michal@maxian.sk" style="color: #8c2e55; text-decoration: underline"
              >michal@maxian.sk</a
            >
          </p>
          <p
            style="
              margin: 0;
              font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
              font-size: 14px;
              line-height: 20px;
            "
          >
            <a href="https://moonbloomlabs.com" style="color: #8c2e55; text-decoration: underline"
              >moonbloomlabs.com</a
            >
          </p>
          <p
            style="
              margin: 8px 0 0;
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 15px;
              line-height: 20px;
              color: #4b4a6e;
            "
          >
            Ideas bloom overnight.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
